name: 🤖 MI Trade Master — 24/7 Signal Bot

on:
  workflow_dispatch:      # manual trigger from Actions tab
  schedule:
    # Safety-net cron: if the self-restart chain ever breaks (e.g. Actions
    # outage), this re-kicks the bot every 15 minutes so it's never down
    # for long. The running job itself re-triggers immediately via the
    # "Queue next run" step below for continuous 24/7 coverage.
    - cron: "*/15 * * * *"

concurrency:
  group: mi-trade-master-live
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # hard GitHub Actions ceiling is 360 min (6h)

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🚀 Queue next run (self-restart chain)
        # Fires a fresh workflow run right away so a new bot instance is
        # already queued/starting before this one's runtime cap is hit —
        # giving seamless 24/7 uptime with no gap between sessions.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "🤖 MI Trade Master — 24/7 Signal Bot" \
            --repo "${{ github.repository }}" || true

      - name: ▶️ Run MI Trade Master
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ADMIN_CHAT_IDS: ${{ secrets.ADMIN_CHAT_IDS }}
          MAX_RUNTIME_MINUTES: "340"
        run: python main.py

      - name: 💾 Commit updated data (subscribers/stats/settings)
        if: always()
        run: |
          git config user.name "mi-trade-master-bot"
          git config user.email "actions@github.com"
          git add data/*.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync bot data [skip ci]"
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}" || echo "Push failed, will sync next run"
          else
            echo "No data changes to commit"
          fi
